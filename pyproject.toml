[project]
name = "shumo-ccc"
version = "0.1.0"
description = "2026 Huashu Cup Problem C: compute-power-storage collaborative scheduling"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
